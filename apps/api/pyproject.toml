[project]
name = "toeic-api"
version = "0.1.0"
description = "TOEIC Pilot FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    # Chỉ dùng cho route nhận file ở môi trường dev (`/media-upload`), thứ được
    # gắn khi environment=development. Vẫn để ở dependency chính chứ không ở
    # extra: thiếu nó thì `LocalDiskDriver.ticket()` trỏ tới một route không tồn
    # tại, và người mới sẽ phải có tài khoản Cloudinary mới chạy được dự án.
    "python-multipart>=0.0.20",
    # Ký URL upload và hỏi lại object store ở bước xác nhận (ADR-006 §2.3).
    # Ở dependency chính chứ không ở extra `content`: `app/core/storage.py` chạy
    # lúc có request, và đặt nó sau extra sẽ vi phạm đúng ranh giới mà
    # `tests/test_content_isolation.py` canh. Ký presigned URL là tính toán
    # thuần cục bộ — không có lượt đi mạng nào ở bước phát vé.
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
# Offline content pipeline only. The production image is built with --no-dev and
# without this extra, so nothing reachable from app.main may import app.content.
content = [
    "edge-tts>=7.0.0",
    "mutagen>=1.47.0",
    "pillow>=11.0.0",
    # Giao diện tương tác của pipeline sinh đề (`generate_exam interact`). Chỉ
    # máy soạn nội dung cần; ảnh API và worker TTS không đụng tới.
    "questionary>=2.0",
]
# Vòng agent viết-và-phê của pipeline sinh đề (planning/AGENTIC-STACK-PLAN.md).
# Extra RIÊNG chứ không gộp vào `content`: hai lý do cài khác nhau, và chỉ ảnh
# worker cần nó. Ảnh API build không kèm extra nào, nên `app.content.exam_agents`
# cũng nằm sau cùng một ranh giới mà `tests/test_content_isolation.py` canh.
agents = [
    "langgraph>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a live PostgreSQL (skipped automatically when absent)",
    "external: calls a third-party network service; never run in CI",
]
# Deselect `external` by default so a bare `pytest` cannot reach out to Microsoft's
# TTS endpoint. Note that an explicit -m on the command line replaces this, so the
# external tests also guard themselves on an env var.
addopts = '-m "not external"'

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
# SQLAlchemy/FastAPI decorators are typed well enough that these two would only
# produce noise on framework call sites we do not control.
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["jose.*", "edge_tts.*", "boto3.*", "botocore.*", "questionary"]
ignore_missing_imports = true

# mutagen ships partial annotations: `MP3.__init__` is untyped and `.info` is
# declared Optional, so strict mode rejects the one call we make. Skipping the
# follow-through treats the package as Any rather than sprinkling per-line ignores.
[[tool.mypy.overrides]]
module = ["mutagen.*", "PIL.*"]
ignore_missing_imports = true
follow_imports = "skip"
