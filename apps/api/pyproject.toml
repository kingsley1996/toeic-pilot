[project]
name = "toeic-api"
version = "0.1.0"
description = "TOEIC Pilot FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a live PostgreSQL (skipped automatically when absent)",
]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
# SQLAlchemy/FastAPI decorators are typed well enough that these two would only
# produce noise on framework call sites we do not control.
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true
