services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toeic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toeic}
      POSTGRES_DB: ${POSTGRES_DB:-toeic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toeic} -d ${POSTGRES_DB:-toeic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-toeic}:${POSTGRES_PASSWORD:-toeic}@postgres:5432/${POSTGRES_DB:-toeic}
      REDIS_URL: redis://redis:6379/0
      # AUDIO_PUBLIC_BASE_URL cố ý KHÔNG có ở đây. Khối `environment` đè lên
      # `env_file`, nên đặt nó ở đây — kể cả dưới dạng ${VAR:-default} — làm
      # .env bị bỏ qua một cách im lặng: sửa .env, khởi động lại, không gì thay
      # đổi. Dạng ${VAR:-default} cũng không cứu được, vì Compose nội suy từ
      # .env của THƯ MỤC DỰ ÁN (`docker/`), không phải từ `env_file`.
      # Mặc định đã nằm ở app/core/config.py; .env là nơi ghi đè nó.
      #
      # DATABASE_URL và REDIS_URL thì phải ở đây, vì chúng trỏ tới tên service
      # của Compose và khác hẳn giá trị dùng trên host.
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api/app:/app/apps/api/app
      - ../apps/api/alembic:/app/apps/api/alembic
      - ../apps/api/alembic.ini:/app/apps/api/alembic.ini
      - ../apps/api/pyproject.toml:/app/apps/api/pyproject.toml
      - ../apps/api/uv.lock:/app/apps/api/uv.lock
      # Generated audio lives on the host (it is gitignored and produced by the
      # offline pipeline, which does not run in this container). No new service:
      # serving it is a static mount, not a dependency.
      - ../apps/api/media:/app/apps/api/media
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/api/app
    healthcheck:
      # /ready (not /health) so a dependent only starts once Postgres is actually reachable.
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages/shared:/app/packages/shared
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
    command: pnpm --filter @toeic-pilot/web dev
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_app_node_modules:
