name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: toeic
          POSTGRES_DB: toeic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toeic -d toeic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://toeic:toeic@localhost:5432/toeic
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check app tests
      - name: Pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build shared package
        run: pnpm --filter @toeic-pilot/shared build
      - name: Lint web
        run: pnpm --filter @toeic-pilot/web lint
      - name: Build web
        run: pnpm --filter @toeic-pilot/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
