name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: toeic
          POSTGRES_DB: toeic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toeic -d toeic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # CI chạy trên Postgres của chính job này (service `postgres` ở trên), KHÔNG
      # BAO GIỜ trên database thật. Trỏ nó ra ngoài là để `alembic upgrade head`
      # và cả bộ pytest — trong đó `test_concurrency.py` chạy `create_all` và ghi
      # dữ liệu — nện thẳng vào production, và là để lộ mật khẩu trong một repo
      # công khai. Một chuỗi kết nối thật không bao giờ thuộc về file này; nó là
      # secret của repo, hoặc là biến trên Render.
      DATABASE_URL: postgresql+psycopg://toeic:toeic@localhost:5432/toeic
      TEST_DATABASE_URL: postgresql+psycopg://toeic:toeic@localhost:5432/toeic
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        # --extra content so ruff and mypy actually see app/content/; without it
        # the pipeline's imports fail to resolve and the checks quietly skip it.
        # --extra agents for langgraph, same reason (app/content/exam_agents/).
        run: uv sync --extra dev --extra content --extra agents
      - name: Ruff (lint)
        run: uv run ruff check app tests
      - name: Ruff (format)
        run: uv run ruff format --check app tests
      - name: Mypy
        run: uv run mypy
      - name: Alembic migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Pytest
        # Postgres is a service here, so the integration-marked concurrency tests
        # run for real rather than skipping.
        run: uv run pytest -v

      - name: Embed the knowledge base into Pinecone
        # Chạy `embed_kb` mỗi lần main thay đổi: knowledge_chunk trên Pinecone phải
        # theo kịp các file `content/kb/*.md` đã commit. `sync_kb` (entrypoint) lo
        # bảng Postgres của production, còn bước này lo VECTOR — `embed_kb` tự sync
        # từ file (không cần DB production) rồi upsert lên Pinecone theo ref.
        #
        # Thiếu khoá thì bỏ qua chứ không fail: PR/forks không có secret vẫn phải
        # xanh, và một bản chưa embed chỉ mất đường semantic, không mất khả năng
        # trả lời (lexical fallback).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: toeic-pilot-kb
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$PINECONE_API_KEY" ]; then
            echo "::warning::embed_kb skipped - GEMINI_API_KEY or PINECONE_API_KEY not set"
            exit 0
          fi
          uv run python -m app.content.embed_kb --create-index

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: Build shared package
        run: pnpm --filter @toeic-pilot/shared build
      - name: Lint web
        run: pnpm --filter @toeic-pilot/web lint
      - name: Build web
        run: pnpm --filter @toeic-pilot/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    # Playwright chạy trên NGĂN XẾP THẬT — Postgres, Redis, API, web. Đắt hơn ba
    # job kia cộng lại, và đó là cái giá đúng: bốn lỗi giao diện của sprint vừa
    # rồi đều nằm ở CHỖ NỐI giữa các tầng, nên không tầng nào tự bắt được chúng.
    # `tsc` xanh, 493 test backend xanh, mà nút Xoá vẫn báo thành công cho một
    # việc chưa hề xảy ra.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: toeic
          POSTGRES_PASSWORD: toeic
          POSTGRES_DB: toeic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toeic -d toeic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://toeic:toeic@localhost:5432/toeic
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: e2e-only-not-a-real-secret
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install API
        working-directory: apps/api
        run: uv sync --extra dev
      - name: Migrations
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Seed thang điểm
        # PHẢI chạy trước `seed_demo_test`. `practice_test.score_scale_slug` mặc
        # định là `'default'` với một khoá ngoại NOT NULL trỏ vào `score_scale`,
        # nên trên một database trắng việc tạo đề đổ ngay bằng ForeignKeyViolation.
        # Lỗi này không hiện ở máy dev vì thang điểm đã được seed từ lâu ở đó —
        # đúng loại lỗi chỉ CI mới thấy.
        working-directory: apps/api
        run: uv run python -m app.content.seed_scores
      - name: Seed đề demo
        # E2E cần MỘT đề đã xuất bản để có gì mà làm. Seed chứ không tạo qua API
        # admin: tài khoản admin không đăng ký được (`register` cố ý không cho
        # chọn vai trò), nên dựng nó trong test sẽ là nhiều giàn giáo hơn cả thứ
        # đang được kiểm.
        working-directory: apps/api
        run: uv run python -m app.content.seed_demo_test
      - name: Chạy API nền
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && break
            sleep 1
          done
          curl -sf http://localhost:8000/ready

      - name: Install web
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @toeic-pilot/shared build
      - name: Build web
        run: pnpm --filter @toeic-pilot/web build
      - name: Playwright browsers
        run: pnpm --filter @toeic-pilot/web exec playwright install --with-deps chromium
      - name: Chạy web nền
        run: |
          pnpm --filter @toeic-pilot/web start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ >/dev/null
      - name: E2E
        run: pnpm --filter @toeic-pilot/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  contract:
    # Guards against the drift in planning/REVIEW-OPUS.md P1-4: shared TypeScript
    # types must stay generated from the API's OpenAPI schema, never hand-edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          (cd apps/api && uv sync --extra dev)
      - name: Regenerate API types
        run: ./scripts/generate-api-types.sh
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- packages/shared/openapi.json packages/shared/src/api-types.ts; then
            echo "::error::API contract changed but generated files were not committed."
            echo "Run 'pnpm gen:api-types' and commit the result."
            exit 1
          fi

  docker:
    # P0-2 shipped a broken image that still built successfully; only running it
    # revealed the problem.
    #
    # Hai ảnh ở đây KHÔNG cùng vai và cố ý được đối xử khác nhau (ADR-014 §7.1):
    #
    #   · `api` là thứ CHẠY Ở PRODUCTION. Job này dựng nó, bắt nó phục vụ HTTP
    #     thật, rồi đẩy CHÍNH ảnh vừa chạy được lên GHCR. Đó là toàn bộ lý do
    #     Render kéo ảnh về thay vì tự dựng lại: dựng lại là cho chạy một ảnh
    #     chưa ai khởi động thử.
    #   · `web` chỉ phục vụ ngăn xếp dev — `NODE_ENV=development`, `CMD pnpm dev`
    #     — và không lên đâu cả (Vercel dựng từ nguồn, §7.2). Dựng để bắt lệch
    #     lockfile; không khởi động vì hỏng lúc chạy sẽ lộ ngay trên máy người
    #     vừa sửa nó, chứ không lộ trước mặt người dùng.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t toeic-api:ci .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t toeic-web:ci .

      - name: API image actually serves HTTP
        # `/health` chứ không phải `/ready`: liveness cố ý không kiểm gì, nên nó
        # trả lời đúng một câu hỏi — tiến trình có lên và định tuyến có chạy
        # không — mà không kéo theo Postgres hay Redis vào phép kiểm.
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e RUN_MIGRATIONS=0 -e DATABASE_URL=sqlite+pysqlite:///:memory: \
            toeic-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health || {
            echo "::error::API image did not serve /health"
            docker logs api-smoke
            exit 1
          }
          docker rm -f api-smoke

      - name: Publish the API image
        # Chỉ trên `main`, và chỉ SAU khi ảnh đã chạy được ở bước trên.
        #
        # Thử lại ba lần: đẩy hỏng vì GHCR chập là chuyện của mạng, không phải
        # của code, mà hậu quả thì giống hệt một lần build hỏng — nhánh đỏ và
        # không ảnh nào lên registry. Đã xảy ra một lần với 5e8ecd4.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}-api"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          # Tag `main` là thứ Render trỏ vào; tag sha để truy được bản nào đang chạy.
          docker tag toeic-api:ci "$IMAGE:main"
          docker tag toeic-api:ci "$IMAGE:${{ github.sha }}"
          for tag in main "${{ github.sha }}"; do
            for attempt in 1 2 3; do
              docker push "$IMAGE:$tag" && break
              [ "$attempt" = 3 ] && { echo "::error::đẩy $IMAGE:$tag hỏng sau 3 lần"; exit 1; }
              echo "đẩy $tag hỏng, thử lại lần $((attempt + 1))"; sleep 5
            done
          done

      - name: Trigger the Render deploy
        # BƯỚC RIÊNG, không gộp với việc đẩy ảnh. Hai việc hỏng vì hai lý do khác
        # hẳn nhau — ảnh không lên được registry là chuyện của build, còn Render
        # từ chối hook là chuyện của cấu hình triển khai — và gộp lại thì log chỉ
        # nói "Publish … failed" mà không nói cái nào. Chính chỗ đó đã tốn một
        # lượt chẩn đoán ở d17476b, nơi ảnh đã lên registry đủ cả hai tag.
        #
        # Vẫn đánh đỏ khi hook bị từ chối: service kiểu ảnh của Render KHÔNG tự
        # triển khai lại, nên hook im lặng hỏng nghĩa là production đứng ở bản cũ
        # trong khi mọi thứ trông bình thường.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK chua dat - anh da day, khong trien khai gi."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$RENDER_DEPLOY_HOOK" || echo 000)
          echo "Render tra ve HTTP $code"
          case "$code" in
            2*) echo "deploy hook da duoc goi" ;;
            000) echo "::error::khong goi duoc deploy hook (mang hoac URL sai)"; exit 1 ;;
            *)  echo "::error::Render tu choi deploy hook voi HTTP $code - lay lai URL o Settings > Deploy Hook"; exit 1 ;;
          esac
